<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>삼각지 대청소</title>
    <meta name="theme-color" content="#9acb87" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="삼각지 대청소" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css?v=51" />
    <script src="./vendor/phaser.min.js"></script>
  </head>
  <body class="start-screen">
    <main class="game-shell">
      <div class="game-stage">
        <div id="game"></div>
        <div class="game-header" aria-label="game status">
        
        </div>
        <!-- 돈 UI -->
        <div class="money-ui">
          <div class="money-item">
            <img src="./assets/ui/10000won.png" alt="만원" class="money-icon icon-10000">
            <span id="count10000">0</span>
          </div>
          <div class="money-item">
            <img src="./assets/ui/1000won.png" alt="천원" class="money-icon icon-1000">
            <span id="count1000">0</span>
          </div>
          <div class="money-item coin-item">
            <img src="./assets/ui/500WON.png" alt="오백원" class="money-icon coin-icon icon-500">
            <span id="count500">0</span>
          </div>
          <div class="money-item coin-item">
            <img src="./assets/ui/100WON.png" alt="백원" class="money-icon coin-icon icon-100">
            <span id="count100">0</span>
          </div>
          <div class="money-total" id="totalMoney">￦0</div>
          <div class="trash-inventory-ui" aria-label="collected trash">
            <div class="trash-inventory-item" title="일반 쓰레기">
              <img src="./assets/ui/trash.png" alt="일반 쓰레기" class="trash-inventory-icon">
              <span id="inventoryNormalCount">0</span>
            </div>
            <div class="trash-inventory-item" title="플라스틱">
              <img src="./assets/ui/plastic.png" alt="플라스틱" class="trash-inventory-icon">
              <span id="inventoryPlasticCount">0</span>
            </div>
            <div class="trash-inventory-item" title="캔">
              <img src="./assets/ui/trash-can.png" alt="캔" class="trash-inventory-icon">
              <span id="inventoryCanCount">0</span>
            </div>
          </div>
        </div>
        <div id="speedBuffHud" class="speed-buff-hud" aria-hidden="true">
          <img src="./assets/objects/acceleration.png" alt="" aria-hidden="true" />
        </div>
        <div id="canQuestHud" class="can-quest-hud is-hidden" aria-hidden="true">
          <div class="can-quest-label" id="canQuestLabel">퀘스트 없음</div>
          <div class="can-quest-bar" id="canQuestBar" aria-label="can quest progress"></div>
        </div>
        <div id="completeOverlay" class="complete-overlay" aria-hidden="true">
          <div class="complete-bloom" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="complete-result" aria-label="result">
            <strong>오늘 청소 완료</strong>
            <span id="resultTrashCount">쓰레기 30개</span>
            <span id="resultCanCount">캔 20개</span>
            <span id="resultHelpUsed">여비 도움 완료</span>
          </div>
          <button id="restartButton" class="restart-button" type="button" aria-label="restart">
            <span class="restart-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div id="specialToast" class="special-toast" aria-hidden="true">
          <img src="./assets/ui/sangcheori-button.png" alt="" aria-hidden="true" />
          <span>고마워</span>
        </div>
        <!-- 대화창 모달 -->
        <div id="dialogModal" class="dialog-modal" style="display: none;">
          <div class="dialog-panel">
            <div class="dialog-portrait" aria-hidden="true"></div>
            <div class="dialog-name"></div>
            <div class="dialog-text"></div>
            <div class="dialog-choices" aria-hidden="true"></div>
            <div class="dialog-next">▼</div>
          </div>
        </div>
        <div class="touch-controls" aria-label="mobile controls">
          <button id="specialButton" class="special-button" type="button" aria-label="yebi item" hidden>
            <img src="./assets/ui/sangcheori-button.png" alt="" aria-hidden="true" />
          </button>
          <button id="sweepButton" type="button" aria-label="sweep">
            <img src="./assets/ui/broom-button.png" alt="" aria-hidden="true" />
          </button>
          <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="fullscreen">
            <span aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div id="movePad" class="move-pad" aria-label="move control" role="application" aria-hidden="true">
        <span id="moveKnob" class="move-knob" aria-hidden="true"></span>
      </div>
    </main>

    <script src="./src/scenes/Preload.js?v=38"></script>
    <script src="./src/scenes/StartScene.js?v=1"></script>
    <script src="./src/systems/DialogueSystem.js?v=3"></script>
    <script src="./src/systems/MoneySystem.js?v=3"></script>
    <script src="./src/systems/QuestManager.js?v=8"></script>
    <script src="./src/scenes/PlayScene.js?v=59"></script>
    <script src="./src/main.js?v=27"></script>
    <script src="./src/pwa.js?v=1"></script>
  </body>
</html>
