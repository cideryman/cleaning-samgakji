<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>삼각지 대청소</title>
    <meta name="theme-color" content="#9acb87" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="삼각지 대청소" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css?v=36" />
    <script src="./vendor/phaser.min.js"></script>
  </head>
  <body class="start-screen">
    <main class="game-shell">
      <div class="game-stage">
        <div id="game"></div>
        <div class="game-header" aria-label="game status">
          <div class="status-stack">
            <div class="status-pill" title="cleaned trash monsters">
              <img class="status-icon" src="./assets/sprites/trash-slime.png" alt="" aria-hidden="true" />
              <div id="cleanProgress" class="clean-progress" aria-label="cleaned trash monsters">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
              <strong id="missionCount" class="mission-count">0/30</strong>
            </div>
            <div class="status-pill can-pill" title="cleaned cans">
              <img class="status-icon" src="./assets/sprites/trash-can.png" alt="" aria-hidden="true" />
              <div id="canProgress" class="can-progress" aria-label="cleaned cans">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
        <div id="completeOverlay" class="complete-overlay" aria-hidden="true">
          <div class="complete-bloom" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="complete-result" aria-label="result">
            <strong>오늘 청소 완료</strong>
            <span id="resultTrashCount">쓰레기 30개</span>
            <span id="resultCanCount">캔 10개</span>
            <span id="resultHelpUsed">상처리 도움 완료</span>
          </div>
          <button id="restartButton" class="restart-button" type="button" aria-label="restart">
            <span class="restart-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div id="specialToast" class="special-toast" aria-hidden="true">
          <img src="./assets/ui/sangcheori-button.png" alt="" aria-hidden="true" />
          <span>고마워</span>
        </div>
        <!-- 대화창 모달 -->
        <div id="dialogModal" class="dialog-modal" style="display: none;">
          <div class="dialog-panel">
            <div class="dialog-name"></div>
            <div class="dialog-text"></div>
            <div class="dialog-next">▼</div>
          </div>
        </div>
        <div class="touch-controls" aria-label="mobile controls">
          <button id="specialButton" class="special-button" type="button" aria-label="sangcheori item" hidden>
            <img src="./assets/ui/sangcheori-button.png" alt="" aria-hidden="true" />
          </button>
          <button id="sweepButton" type="button" aria-label="sweep">
            <img src="./assets/ui/broom-button.png" alt="" aria-hidden="true" />
          </button>
          <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="fullscreen">
            <span aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div id="movePad" class="move-pad" aria-label="move control" role="application" aria-hidden="true">
        <span id="moveKnob" class="move-knob" aria-hidden="true"></span>
      </div>
    </main>

    <script src="./src/scenes/Preload.js?v=34"></script>
    <script src="./src/scenes/StartScene.js?v=1"></script>
    <script src="./src/scenes/PlayScene.js?v=34"></script>
    <script src="./src/main.js?v=27"></script>
    <script src="./src/pwa.js?v=1"></script>
    <script src="./src/systems/DialogueSystem.js"></script>
    <script src="./src/scenes/PlayScene.js?v=34"></script>
  </body>
</html>
